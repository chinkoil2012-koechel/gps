<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GPSテスト</title>
</head>
<body>

<h2>GPSテスト</h2>

<button onclick="getGPS()">位置情報取得</button>

<div id="result"></div>

<script>

function getGPS(){

document.getElementById("result").innerHTML =
"取得中...";

navigator.geolocation.getCurrentPosition(

function(pos){

document.getElementById("result").innerHTML =
"成功<br><br>" +
"緯度：" + pos.coords.latitude +
"<br>経度：" + pos.coords.longitude;

},

function(err){

document.getElementById("result").innerHTML =
"失敗<br>コード：" + err.code +
"<br>内容：" + err.message;

}

);

}

</script>

</body>
</html>
