<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPSテスト</title>
</head>
<body style="font-size:20px;padding:20px;text-align:center;">
<h2>イトゥビル GPSテスト</h2>

<button onclick="getGPS()"
style="font-size:28px;padding:20px 40px;">
位置情報取得
</button>

<div id="result"></div>

<script>

function getGPS(){

const building = "イトゥビル";
const params = new URLSearchParams(window.location.search);
const employee = params.get("employee");


document.getElementById("result").innerHTML =
"取得中...<br>" +
building +
"<br>" +
employee;

navigator.geolocation.getCurrentPosition(

function(pos){

document.getElementById("result").innerHTML =
"位置情報取得完了<br><br>" +
"建物：" + building +
"<br>" +
"氏名：" + employee +
"<br><br>" +
"緯度：" + pos.coords.latitude +
"<br>" +
"経度：" + pos.coords.longitude +
"<br><br>フォームを開いています...";

setTimeout(function(){

location.href =
"https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=ldnlsQxkbke7nO1NX1N_hKgS1X07HpZJqyuN6UG34pxURFpZRDVMSE02UkI0NzVWSDRUREw3UDczQy4u"
+ "&employee=" + encodeURIComponent(employee);

}, 800);

},


function(err){

document.getElementById("result").innerHTML =
"失敗<br>コード：" + err.code +
"<br>内容：" + err.message;

}

);

}
window.onload = getGPS;
</script>

</body>
</html>
